# ══════════════════════════════════════════════════════════════
#  FINAL FANTASY XIV — Hyprland Configuration
#  Nobara Linux / Wayland
# ══════════════════════════════════════════════════════════════

# ── Monitors ──────────────────────────────────────────────────
# Adjust resolution/refresh to match your display
monitor = ,preferred,auto,1

# ── Autostart ─────────────────────────────────────────────────
exec-once = ~/.config/hypr/hyprland-wallpaper.sh
exec-once = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
exec-once = eww daemon && eww open-many limit_break_win clock_win party_win quest_win music_win gil_win
exec-once = python3 ~/.config/eww/scripts/discord_monitor.py
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = dunst
exec-once = wl-paste --watch cliphist store
exec-once = hypridle

# ── Environment ───────────────────────────────────────────────
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# ── Input ─────────────────────────────────────────────────────
input {
  kb_layout  = pl          # Change to your layout!
  follow_mouse = 1
  sensitivity = 0

  touchpad {
    natural_scroll = true
    tap-to-click   = true
  }
}

# ── General ───────────────────────────────────────────────────
general {
  gaps_in        = 6
  gaps_out       = 14
  border_size    = 2

  # FFXIV gold borders
  col.active_border   = rgba(c8a840ff) rgba(f0d090ff) 45deg
  col.inactive_border = rgba(2a1e0aaa)

  layout = dwindle
  resize_on_border = true
}

# ── Decoration ────────────────────────────────────────────────
decoration {
  rounding = 6

  blur {
    enabled     = true
    size        = 8
    passes      = 3
    new_optimizations = true
    xray        = false
    ignore_opacity = false
  }

  # Subtle shadow — like the FF UI panel glow
  drop_shadow      = true
  shadow_range     = 24
  shadow_render_power = 3
  col.shadow       = rgba(c8a84055)
  col.shadow_inactive = rgba(00000040)

  dim_inactive     = true
  dim_strength     = 0.08
}

# ── Animations (FF-style: fast, elegant transitions) ──────────
animations {
  enabled = true

  bezier = ffxivEase,   0.25, 0.46, 0.45, 0.94
  bezier = ffxivSnap,   0.68, -0.06, 0.32, 1.2
  bezier = ffxivFade,   0.0,  0.0,  0.2,  1.0
  bezier = overshot,    0.13, 0.99, 0.29, 1.1

  animation = windows,     1, 4,  ffxivSnap, slide
  animation = windowsOut,  1, 3,  ffxivFade, slide
  animation = border,      1, 8,  default
  animation = borderangle, 1, 180, default, loop
  animation = fade,        1, 4,  ffxivFade
  animation = workspaces,  1, 5,  ffxivEase, slidevert
  animation = specialWorkspace, 1, 5, ffxivEase, fade
}

# ── Layout ────────────────────────────────────────────────────
dwindle {
  pseudotile         = true
  preserve_split     = true
  smart_split        = false
  smart_resizing     = true
}

master {
  new_is_master = false
}

# ── Gestures ──────────────────────────────────────────────────
gestures {
  workspace_swipe = true
  workspace_swipe_fingers = 3
  workspace_swipe_distance = 250
}

# ── Miscellaneous ─────────────────────────────────────────────
misc {
  force_default_wallpaper = 0
  disable_hyprland_logo   = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  key_press_enables_dpms  = true
  animate_manual_resizes  = true
  animate_mouse_windowdragging = true
}

# ── Window Rules ──────────────────────────────────────────────

# Float smaller utility windows
windowrulev2 = float,       class:^(pavucontrol)$
windowrulev2 = float,       class:^(nm-connection-editor)$
windowrulev2 = float,       class:^(file-roller)$
windowrulev2 = float,       title:^(Picture-in-Picture)$
windowrulev2 = float,       class:^(org.kde.polkit-kde-authentication-agent-1)$

# Keep EWW widgets on top and clickthrough background
windowrulev2 = nofocus,     class:^(eww-.*)$
windowrulev2 = noshadow,    class:^(eww-.*)$

# Steam — prevent it from grabbing focus on launch
windowrulev2 = workspace silent 8, class:^(steam)$

# Discord — workspace 7
windowrulev2 = workspace 7, class:^(discord)$
windowrulev2 = workspace 7, class:^(vesktop)$

# ── Keybindings ───────────────────────────────────────────────
$mod  = SUPER
$term = kitty
$menu = ~/.config/rofi/ffxiv-icons.sh

# Core
bind = $mod, Return, exec, $term
bind = $mod, Q,      killactive
bind = $mod, M,      exit
bind = $mod, F,      fullscreen
bind = $mod, T,      togglefloating
bind = $mod, P,      pseudo
bind = $mod, J,      togglesplit
bind = $mod, SPACE,  exec, $menu

# File manager
bind = $mod, E, exec, thunar

# Screenshots
bind = ,      Print,        exec, hyprshot -m output
bind = $mod,  Print,        exec, hyprshot -m window
bind = SHIFT, Print,        exec, hyprshot -m region

# Notifications
bind = $mod, N, exec, dunstctl close
bind = $mod SHIFT, N, exec, dunstctl close-all

# Quest log toggle
bind = $mod, L, exec, eww toggle quest_win

# Music controls (FFXIV hotbar-style: Ctrl + numpad)
bind = , XF86AudioPlay,  exec, playerctl play-pause
bind = , XF86AudioNext,  exec, playerctl next
bind = , XF86AudioPrev,  exec, playerctl previous
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Move focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H,     movefocus, l
bind = $mod, L,     movefocus, r
bind = $mod, K,     movefocus, u
bind = $mod, J,     movefocus, d

# Move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Resize
binde = $mod CTRL, right, resizeactive,  40  0
binde = $mod CTRL, left,  resizeactive, -40  0
binde = $mod CTRL, up,    resizeactive,   0 -40
binde = $mod CTRL, down,  resizeactive,   0  40

# Workspaces 1-8
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Move/resize with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
