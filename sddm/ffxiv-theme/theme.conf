[General]
# Path to your MP4 login animation (relative to theme dir or absolute)
# Copy your mp4 to /usr/share/sddm/themes/ffxiv-login/background.mp4
background=background.mp4

# Fallback static image if mp4 is missing
background_fallback=background.png

# Sound played on login screen load (mp3)
login_sound=login.mp3

# Volume 0-100
sound_volume=70
